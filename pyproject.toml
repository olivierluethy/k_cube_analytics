[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "k_cube_analytics"
version = "0.1.0"
description = "Stock analytics toolkit (yfinance-backed): performance, dividends, event & sentiment analysis."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
k-cube-analytics = "k_cube_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["k_cube_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
